server:
  port: 8082

spring:
  application:
    name: coupon-service

  # 1. Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/lms_coupon_db
    username: shivasai
    password: '1932'
    driver-class-name: org.postgresql.Driver

  # 2. Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379

  # 3. Security Configuration (FIXED SYNTAX)
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-data: |
            

  # 4. JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # 5. Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  cache:
    type: none